<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvtut2ml"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2d27">
  <title>WDI inspection</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: #eef2f0; }
    .gtop { background: #1f2d27; color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .gtop a { color: #a8c3b4; text-decoration: none; }
    .gtop .sub { color: #a8c3b4; font-size: 13px; }
    .gtop .saved { margin-left: auto; font-size: 13px; color: #a8c3b4; }
    .wrap { padding: 12px; max-width: 760px; margin: 0 auto; padding-bottom: 80px; }
    .sec h2 { font-size: 16px; margin: 0 0 4px; }
    .sec .lead { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
    .boxes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .boxes label { display: inline-flex; gap: 6px; align-items: center; background: #f4f7f5; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
    .boxes label:has(input:checked) { background: #e6f4ea; border-color: var(--brand); font-weight: 600; }
    .found { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .found label { border: 2px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: flex-start; }
    .found label:has(input:checked) { border-color: var(--brand); background: #f0faf3; }
    .sub-q { margin: 8px 0 0 4px; padding-left: 12px; border-left: 3px solid var(--line); }
    .problems { margin: 0; padding-left: 18px; }
    canvas.sig { width: 100%; height: 140px; border: 1px dashed #a0aec0; border-radius: 8px; background: #fff; touch-action: none; }
  </style>
</head>
<body>
  <div id="app"><p class="muted" style="padding:20px">Loading...</p></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/wdi.js"></script>
</body>
</html>
