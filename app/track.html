<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvtut2ml"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your technician</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <link rel="stylesheet" href="/nuvolve/app/vendor/leaflet/leaflet.css">
  <script src="/nuvolve/app/vendor/leaflet/leaflet.js" defer></script>
  <style>
    body { background: linear-gradient(160deg, #1f2d27, #2f855a); min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 16px; }
    .card { text-align: center; padding: 24px 20px; }
    .face { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); background: #e2e8f0; display: grid; place-items: center; font-size: 44px; margin: 0 auto; }
    .eta { font-size: 40px; font-weight: 800; margin: 6px 0 0; color: var(--brand-dark); }
    #tmap { height: 260px; border-radius: 12px; margin-top: 16px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #48bb78; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="wrap"><div class="card" id="app"><p class="muted">Loading...</p></div></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/track.js"></script>
</body>
</html>
