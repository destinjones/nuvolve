<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvto1yh6"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2d27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Route">
  <title>My Route</title>
  <link rel="manifest" href="/nuvolve/app/tech.webmanifest">
  <link rel="icon" href="/nuvolve/app/icons/tech.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nuvolve/app/icons/tech-180.png">
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: #eef2f0; }
    .top { background: #1f2d27; color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
    .top h1 { font-size: 19px; margin: 0; }
    .top .sub { color: #a8c3b4; font-size: 13px; }
    .wrap { padding: 12px; max-width: 640px; margin: 0 auto; }
    .daybar { display: flex; gap: 6px; margin-top: 10px; }
    .daybar button { flex: 1; background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 8px; padding: 8px; font-weight: 600; font: inherit; }
    .daybar button.on { background: var(--brand); }
    .tstop { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
    .tstop .n { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; display: grid; place-items: center; }
    .tstop.completed .n, .tstop.skipped .n { background: #a0aec0; }
    .tstop.completed, .tstop.skipped { opacity: .7; }
    .tstop .info { flex: 1; min-width: 0; }
    .tstop b { font-size: 16px; }
    .bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .progress { height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; margin-top: 10px; }
    .wrap { padding-bottom: 90px; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
    .tabbar a { flex: 1; text-align: center; padding: 8px; font-size: 12px; color: var(--muted); text-decoration: none; font-weight: 600; }
    .tabbar a.on { color: var(--brand-dark); }
    .progress div { height: 8px; background: #68d391; border-radius: 4px; }
    .tstop-wrap { position: relative; }
    .tstop-wrap .tstop { padding-right: 76px; }
    .tthumb { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #e2e8f0; }
    .tnav { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 58px; height: 58px; border-radius: 14px; border: 0; background: var(--brand); color: #fff; font-size: 20px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
    .tnav span { font-size: 11px; font-weight: 700; }
    .house-card { overflow: hidden; }
    .house-pic { position: relative; }
    .house-pic img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #e2e8f0; }
    .house-tag { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 999px; }
    .bigbtns .btn.primary { grid-column: 1 / -1; }
    .syncbar { position: fixed; left: 12px; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 25; max-width: 616px; margin: 0 auto;
      display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #1f2d27; color: #fff; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    .syncbar[hidden] { display: none; }
    .syncbar.bad { background: var(--danger); }
    .syncbar span { flex: 1; }
    .syncbar .btn { flex: 0 0 auto; }
    .saved-copy { color: #f6e05e; font-size: 13px; margin-top: 4px; }
    .tstop .waiting { color: var(--warn); font-weight: 600; }
    .tstop .fix { color: var(--danger); font-weight: 600; }
    .gps-badge { display: block; background: none; border: 0; color: #a8c3b4; font: inherit; font-size: 12px; padding: 6px 0 0; cursor: pointer; text-align: left; }
    .gps-badge.on { color: #68d391; }
    .tstop .late { color: var(--danger); font-weight: 600; }
    .face-sm { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #e2e8f0; flex: 0 0 64px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="syncbar" class="syncbar" hidden role="status"></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/outbox.js"></script>
  <script src="/nuvolve/app/js/tech.js"></script>
</body>
</html>
