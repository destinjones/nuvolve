<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvtut2ml"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your account</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: #eef2f0; }
    .hero { background: linear-gradient(160deg, #1f2d27, #2f855a); color: #fff; padding: 28px 16px 70px; text-align: center; }
    .hero h1 { font-size: 22px; }
    .hero .co { opacity: .8; font-size: 14px; }
    .wrap { max-width: 560px; margin: -50px auto 40px; padding: 0 12px; }
    .due { text-align: center; }
    .due .amt { font-size: 42px; font-weight: 800; margin: 4px 0; }
    .tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .tips button { padding: 10px 4px; border: 1px solid #cbd5e0; background: #fff; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    .tips button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 10px; }
    .line:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <div id="app"><p style="text-align:center;padding:40px" class="muted">Loading your account...</p></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/portal.js"></script>
</body>
</html>
