<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvto1yh6"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuvolve API</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: var(--bg, #f7fafc); }
    .dev { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
    .dev h1 { margin-bottom: 4px; }
    .dev pre { background: #1a202c; color: #e2e8f0; padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
    .dev .desc p { margin: 8px 0; }
    .ep { border-top: 1px solid var(--line, #e2e8f0); padding: 14px 0; }
    .ep summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .verb { font: 700 12px ui-monospace, Menlo, monospace; padding: 2px 8px; border-radius: 4px; min-width: 52px; text-align: center; color: #fff; }
    .verb.get { background: #2b6cb0; } .verb.post { background: #2f855a; } .verb.patch { background: #b7791f; } .verb.delete { background: #c53030; }
    .fields { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .fields td { border-top: 1px solid var(--line, #e2e8f0); padding: 5px 8px 5px 0; vertical-align: top; }
    .fields td:first-child { font-family: ui-monospace, Menlo, monospace; }
    .fields td { overflow-wrap: anywhere; }
    nav.toc a { margin-right: 12px; }
  </style>
</head>
<body>
  <main class="dev" id="root"><p class="muted">Loading…</p></main>
  <script src="/nuvolve/app/js/developers.js"></script>
</body>
</html>
