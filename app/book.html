<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvtut2ml"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book pest control</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: transparent; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 12px; }
    .svc { display: grid; gap: 8px; }
    .svc label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: #fff; font-weight: 500; }
    .svc label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
    .svc input { margin-top: 3px; width: auto; flex: 0 0 auto; }
    .svc span { flex: 1; text-align: left; }
    .hp { position: absolute; left: -5000px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="wrap"><div class="card" id="app"><p class="muted">Loading...</p></div></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/book.js"></script>
</body>
</html>
