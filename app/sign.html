<!doctype html>
<html lang="en">
<head>
  <script src="/nuvolve/app/demo-boot.js?v=mvtut2ml"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your estimate</title>
  <link rel="stylesheet" href="/nuvolve/app/css/styles.css">
  <style>
    body { background: #eef2f0; }
    .hero { background: linear-gradient(160deg, #1f2d27, #2f855a); color: #fff; padding: 26px 16px 64px; text-align: center; }
    .hero h1 { font-size: 22px; margin: 4px 0 0; }
    .hero .co { opacity: .85; font-size: 14px; }
    .wrap { max-width: 640px; margin: -46px auto 40px; padding: 0 12px; }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .line:last-child { border-bottom: 0; }
    .totals { display: flex; justify-content: space-between; gap: 12px; background: var(--brand-soft); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 15px; }
    .terms { white-space: pre-wrap; font-size: 13px; line-height: 1.5; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fafbfa; }
    .signed-sig { max-width: 320px; width: 100%; border-bottom: 1px solid #1a202c; }
    .meta { font-size: 12px; color: var(--muted); word-break: break-all; }
    @media print { body { background: #fff; } .hero { background: none; color: #000; padding: 0 0 10px; text-align: left; } .wrap { margin: 0; max-width: none; } .terms { max-height: none; overflow: visible; border: 0; padding: 0; } }
  </style>
</head>
<body>
  <div id="app"><p style="text-align:center;padding:40px" class="muted">Loading your estimate...</p></div>
  <script src="/nuvolve/app/js/common.js"></script>
  <script src="/nuvolve/app/js/sign.js"></script>
</body>
</html>
